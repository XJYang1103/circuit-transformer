# 【YAML注意事项】
# 缩进必须是空格，禁止 Tab，缩进错了直接解析报错
# 大小写敏感：True 和 true 在很多 yaml 解析器都支持，但规范写小写 true/false
# 冒号后面必须带空格：name: deepsyn ✅；name:deepsyn ❌
# ~ 波浪号代表 Linux 家目录，yaml 本身不解析，由 python 代码处理
# 一句话概括：YAML 就是写配置用的文本文件，这份文件就是用来一次性指定电路 Transformer 训练的全部参数。




# 训练配置：8输入/2输出随机电路数据集，数据集目标由ABC工具中 `&deepsyn -T 1` 优化得到
#
#   python scripts/train.py --config configs/train_deepsyn.yaml
#   python scripts/train.py --config configs/train_deepsyn.yaml --dry-run
#
# 路径可以是绝对路径，也可以以 ~ / $HOME 开头；train.py 脚本会自动展开。
# CLI 会在调用 PyTorch 训练循环之前展开路径。
#
# 这些参数为库默认值，加上README中公开权重对应的配置。仅作为起点，不是调优好的最终方案：
# README没有记录发布的 `deepsyn_reinforced` 权重对应的精确超参，所以轮数、批次大小需要自行调整。
run:
  # 实验输出目录格式：<output_root>/<时间戳>-<run_name>/
  name: deepsyn_8i2o
paths:
  # 存放训练json文件的目录，train()会把该目录下所有文件都当作训练文件。
  # 目录由 scripts/download_data.sh 脚本下载解压得到，解压后顶层文件夹
  # `8_inputs_2_outputs_random_deepsyn/` 放到train目录下。
  data_dir: ~/data/circuit-transformer/train/8_inputs_2_outputs_random_deepsyn
  # 每次实验会生成带时间戳的独立子目录，保证不同调参实验不会互相覆盖
  # 模型文件 `model-<epoch>`，模型文件名本身不带任务标识。
  output_root: ~/runs/circuit-transformer
model:
  # CircuitTransformer模型构造参数，全部显式写出，不依赖默认值，方便集中查看。
  #
  # num_inputs必须和数据集匹配：本数据集所有电路都是8输入、2输出。
  # `optimize`阶段如果序列超过max_seq_length会给出警告并截断序列。
  num_inputs: 8
  embedding_width: 512
  num_layers: 12
  num_attention_heads: 8
  intermediate_size: 2048
  max_tree_depth: 32
  max_seq_length: 200
  mixed_precision: true
  verbose: 1
  device: cuda

train:
  # 参数直接传给 CircuitTransformer.train()
  epochs: 10
  batch_size: 128
  validation_split: 0.1
  initial_epoch: 0
  # 默认使用原版 MPDataset 的 8 进程无序数据生成方式，
  # 每轮样本数保持为 N−1；仅在调试时设为 0。
  num_workers: 8

  # false = 每轮保存一个 .pt 权重文件；true = 按原版批次间隔保存，
  # 因此仍可能在多轮中生成文件。
  latest_ckpt_only: false

  # true = 在 <run_dir>/tensorboard 写入 PyTorch profiler 追踪数据。
  # 性能分析有额外开销，常规训练保持关闭。
  profile: false
  distributed: false
