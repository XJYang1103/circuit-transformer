# 【YAML注意事项】
# 缩进必须是空格，禁止 Tab，缩进错了直接解析报错
# 大小写敏感：True 和 true 在很多 yaml 解析器都支持，但规范写小写 true/false
# 冒号后面必须带空格：name: deepsyn ✅；name:deepsyn ❌
# ~ 波浪号代表 Linux 家目录，yaml 本身不解析，由 python 代码处理
# 一句话概括：YAML 就是写配置用的文本文件，这份文件就是用来一次性指定电路 Transformer 训练的全部参数。


# 训练配置：8输入/2输出随机电路数据集，数据集目标由ABC工具中 `&deepsyn -T 1` 优化得到
#
#   python scripts/train.py --config configs/train_deepsyn.yaml
#   python scripts/train.py --config configs/train_deepsyn.yaml --dry-run
#
# 路径可以是绝对路径，也可以以 ~ / $HOME 开头；train.py 脚本会自动展开。
# CLI 会在调用 PyTorch 训练循环之前展开路径。

run:
  # 实验输出目录格式：<output_root>/<时间戳>-<run_name>/
  name: deepsyn_8i2o_1
paths:
  # 存放训练json文件的目录，train()会把该目录下所有文件都当作训练文件。
  # 从 README 中的数据集地址下载并解压；指向直接包含 .json 文件的
  # `8_inputs_2_outputs_random_deepsyn/` 目录。
  data_dir: ~/data/circuit-transformer/train/8_inputs_2_outputs_random_deepsyn
  # 每次实验会生成带时间戳的独立子目录，保证不同调参实验不会互相覆盖
  # 模型文件为 `ckpt/model-<epoch>.pt`，运行目录还会保存 resolved_config.yaml。
  output_root: ~/runs/circuit-transformer
model:
  # CircuitTransformer模型构造参数，全部显式写出，不依赖默认值，方便集中查看。
  #
  # num_inputs必须和数据集匹配：本数据集所有电路都是8输入、2输出。
  # `optimize`阶段如果序列超过max_seq_length会给出警告并截断序列。
  num_inputs: 8
  embedding_width: 512
  num_layers: 12
  num_attention_heads: 8
  intermediate_size: 2048
  max_tree_depth: 32
  max_seq_length: 200
  mixed_precision: true
  verbose: 1
  device: cuda
  # null = 随机初始化，从零训练；测试权重不会自动加载。
  # 如需从已有模型参数开始新训练，可填 .pt 路径或使用 --resume。
  # 该方式不会恢复优化器和学习率进度。

  #权重路径
  ckpt_path: null  #null是从随机权重开始训练，如果想从从已有权重继续训练，那就在这里加上.pt的路径

train:
  # 参数直接传给 CircuitTransformer.train()
  epochs: 10

  batch_size: 128
#改 batch 会连累学习率曲线，而它现在是写死的
# CustomSchedule 按优化器步数算学习率（training.py:127），warmup 4000 步写死、配置里改不到。batch 128 → 256 会让：
# 每 epoch 步数 35719 → 17859，减半
# 10 epoch 结束时的学习率差 √2 ≈ 1.41 倍
# 热身覆盖的样本量翻倍
#比如本来规定前几个epoch学习率每轮提高一点，但是越往后就要修改他，比如让学习率每轮减少一点


  validation_split: 0.1  #约 90% 数据训练，10% 数据验证
  initial_epoch: 0
  # 默认使用原版 MPDataset 的 8 进程无序数据生成方式，
  # 每轮样本数保持为 N−1；仅在调试时设为 0。
  num_workers: 8  #使用 8 个进程进行训练数据加载和编码

  # false = 每轮保存一个 .pt 权重文件；true = 按原版批次间隔保存，
  # 因此仍可能在多轮中生成文件。
  latest_ckpt_only: false

  # true = 在 <run_dir>/tensorboard 写入 PyTorch profiler 追踪数据。
  # 性能分析有额外开销，常规训练保持关闭。
  profile: false

  # true = 用两块 V100 做数据并行（每张卡各分一半 batch，梯度取平均）。
  # 前置条件：卡间 P2P 必须正常。本机曾因 AMD IOMMU 拦截 P2P 写入而静默返回全 0，
  # 已在 GRUB 加 iommu=pt 修复（详见提交历史与内核 cmdline）。若换机器或重装系统，
  # 先用 50 次跨卡拷贝测试确认 P2P 正确再开启，否则会得到静默错误的梯度。
  distributed: true  #是否使用多卡
